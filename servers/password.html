<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator - ToolHub</title>

    <link rel="stylesheet" href="/assets/c2.css">
</head>
<body>

    <header>
        <div class="logo">Tool<span>Hub</span></div>

        <nav>
            <a href="/">Home</a>
            <a href="/#tools">Tools</a>
        </nav>
    </header>

    <main class="password-generator">

        <h1>Password Generator</h1>

        <p>Create strong and secure random passwords.</p>

        <div class="password-box">

            <input
                type="text"
                id="passwordOutput"
                placeholder="Your password will appear here"
                readonly
            >

            <button id="copyButton">Copy</button>

        </div>

        <div class="password-length">

            <label for="length">
                Password Length:
            </label>

            <input
                type="number"
                id="length"
                min="4"
                max="64"
                value="12"
            >

        </div>

        <div class="password-options">

            <label>
                <input type="checkbox" id="uppercase" checked>
                Uppercase Letters (A-Z)
            </label>

            <label>
                <input type="checkbox" id="lowercase" checked>
                Lowercase Letters (a-z)
            </label>

            <label>
                <input type="checkbox" id="numbers" checked>
                Numbers (0-9)
            </label>

            <label>
                <input type="checkbox" id="symbols" checked>
                Special Characters (!@#$)
            </label>

        </div>

        <button id="generateButton">
            Generate Password
        </button>

        <p id="passwordMessage"></p>

    </main>

    <script src="/assets/password.js"></script>

</body>
</html>
