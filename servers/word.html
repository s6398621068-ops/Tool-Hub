<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Word Counter - ToolHub</title>

    <link rel="stylesheet" href="/assets/c2.css">
</head>
<body>

    <header>
        <div class="logo">Tool<span>Hub</span></div>

        <nav>
            <a href="/">Home</a>
            <a href="/#tools">Tools</a>
        </nav>
    </header>

    <main class="word-counter">

        <h1>Word Counter</h1>

        <p>Count words, characters, sentences and paragraphs.</p>

        <textarea
            id="textInput"
            placeholder="Start typing or paste your text here..."
        ></textarea>

        <div class="word-stats">

            <div class="stat-card">
                <h3 id="wordCount">0</h3>
                <p>Words</p>
            </div>

            <div class="stat-card">
                <h3 id="charCount">0</h3>
                <p>Characters</p>
            </div>

            <div class="stat-card">
                <h3 id="sentenceCount">0</h3>
                <p>Sentences</p>
            </div>

            <div class="stat-card">
                <h3 id="paragraphCount">0</h3>
                <p>Paragraphs</p>
            </div>

        </div>

        <div class="word-buttons">
            <button id="clearButton">Clear Text</button>
            <button id="copyButton">Copy Text</button>
        </div>

    </main>

    <script src="/assets/word.js"></script>

</body>
</html>
